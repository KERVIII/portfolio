<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KERVIII — Android & WebUI Developer</title>
<meta name="description" content="KERVIII builds Android modules, web interfaces and practical tools.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--r:#e0413c;--r2:#7d1512;--tx:#f3eeee;--mu:#a09696;--e:cubic-bezier(.22,1,.36,1);--b:cubic-bezier(.34,1.56,.64,1);--g:rgba(255,255,255,.04);--l:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:dark;scroll-padding-top:84px}
body{background:#000;color:var(--tx);font:400 16px/1.65 Poppins,system-ui,sans-serif;overflow-x:hidden;min-height:100vh}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(45% 35% at 20% 12%,rgba(125,21,18,.5),transparent 70%),radial-gradient(40% 30% at 85% 70%,rgba(125,21,18,.32),transparent 70%);animation:drift 22s ease-in-out infinite alternate;will-change:transform}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
a{color:inherit;text-decoration:none}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
:focus-visible{outline:2px solid var(--r);outline-offset:3px}
#bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--r);transform:scaleX(0);transform-origin:0 50%;z-index:60;box-shadow:0 0 12px var(--r)}
/* nav */
header{position:fixed;z-index:50;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 18px;border-radius:20px;background:rgba(10,6,6,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--l)}
.logo{font-weight:700;font-size:1.25rem;letter-spacing:.02em;color:var(--r);text-shadow:0 0 18px rgba(224,65,60,.6)}
nav.d{display:none;gap:4px}
nav a{padding:8px 14px;border-radius:12px;font-size:.88rem;font-weight:500;color:var(--mu);transition:color .4s,background .4s}
nav a:hover,nav a.on{color:#fff;background:rgba(224,65,60,.14)}
.burger{width:46px;height:46px;border-radius:14px;border:1px solid var(--l);background:var(--g);color:#fff;font-size:1.3rem;display:grid;place-items:center;cursor:pointer;transition:transform .45s var(--b),border-color .4s}
.burger:active{transform:scale(.88)}.burger[aria-expanded=true]{border-color:var(--r);transform:rotate(90deg)}
.menu{position:fixed;z-index:45;inset:0;background:rgba(6,2,2,.97);will-change:clip-path;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;clip-path:circle(0 at calc(100% - 45px) 55px);transition:clip-path .9s var(--e);visibility:hidden}
.menu.open{clip-path:circle(150% at calc(100% - 45px) 55px);visibility:visible}
.menu a{font-size:1.9rem;font-weight:600;padding:8px 20px;opacity:0;transform:translateY(24px) scale(.94);transition:opacity .7s var(--e),transform .8s var(--e),color .3s}
.menu.open a{opacity:1;transform:none;transition-delay:calc(var(--i)*70ms + 250ms)}
.menu a:hover{color:var(--r)}
@media(min-width:860px){nav.d{display:flex}.burger,.menu{display:none}}
/* layout */
.sec{padding:clamp(72px,12vw,130px) 20px 0;max-width:1080px;margin:auto}
h2.t{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:600;text-align:center;line-height:1.2;margin-bottom:clamp(32px,6vw,56px)}
h2.t:after{content:"";display:block;height:2px;width:64px;margin:12px auto 0;background:var(--r);box-shadow:0 0 14px var(--r);transform:scaleX(0);transition:transform 1.1s .35s var(--e)}
h2.t.in:after{transform:scaleX(1)}
.rv{opacity:0;transform:translate3d(0,40px,0) scale(.96);filter:blur(5px);transition:opacity .9s var(--e),transform 1s var(--e),filter .9s var(--e);transition-delay:calc(var(--i,0)*90ms)}
.rv.in{opacity:1;transform:none;filter:none}
/* hero */
.hero{min-height:100svh;display:grid;align-items:center;gap:36px;padding:110px 20px 60px;max-width:1080px;margin:auto;text-align:center}
.pic{position:relative;width:min(68vw,320px);aspect-ratio:4/5;margin:auto;clip-path:circle(0% at 50% 50%);animation:reveal 1.5s .15s var(--e) forwards}
@keyframes reveal{to{clip-path:circle(75% at 50% 50%)}}
.pic:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(224,65,60,.5),transparent 72%);filter:blur(14px);z-index:-1}
.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%;box-shadow:0 0 0 2px rgba(224,65,60,.55),0 0 60px rgba(224,65,60,.4);transition:transform 1.2s var(--e)}
.pic:hover img{transform:scale(1.04)}
.pic:after{content:"";position:absolute;inset:-4px;border-radius:50%;padding:2px;background:conic-gradient(from var(--a),transparent 0 78%,#ff6a5f 92%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:rot 7s linear infinite;will-change:transform}
@keyframes spin{to{--a:360deg}}
@keyframes rot{to{transform:rotate(360deg)}}
.hero h1{font-size:clamp(1.3rem,4vw,1.6rem);font-weight:500}
.hero h1 b,.hero h3 span,.big em{color:var(--r);font-style:normal}
.big{font-size:clamp(2.1rem,8.2vw,3.5rem);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:10px 0}
.hero h3{font-size:clamp(1.05rem,3.4vw,1.4rem);font-weight:600;min-height:1.7em}
.caret{display:inline-block;width:2px;height:1em;background:var(--r);margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.hero p{color:var(--mu);max-width:520px;margin:14px auto 26px}
.orbs{display:flex;justify-content:center;gap:14px;margin-bottom:26px}
.orb{position:relative;width:54px;height:54px;border-radius:50%;border:2px solid var(--r);color:var(--r);display:grid;place-items:center;font-size:1.35rem;background:transparent;transition:transform .45s var(--e),box-shadow .45s,background .45s,color .45s}
.orb svg{transition:transform .5s var(--e),opacity .3s}
.orb:hover{transform:scale(1.1);background:var(--r);color:#000;box-shadow:0 0 26px rgba(224,65,60,.55)}
.orb:after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--r);opacity:0;pointer-events:none}
.orb.go{animation:orb .7s var(--e)}.orb.go svg{animation:ic .7s var(--e)}.orb.go:after{animation:rip .7s .26s var(--e)}
@keyframes orb{0%{transform:scale(1)}20%{transform:scale(.88)}46%{transform:scale(.5);background:rgba(224,65,60,.7);box-shadow:0 0 34px var(--r)}72%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes ic{0%,15%{transform:scale(1);opacity:1}46%{transform:scale(.2);opacity:0}75%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes rip{from{transform:scale(1);opacity:.9}to{transform:scale(2.7);opacity:0}}
.btns{display:grid;gap:12px;max-width:420px;margin:auto}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 26px;border-radius:14px;font-weight:600;font-size:.95rem;border:1.5px solid var(--r);color:#fff;background:linear-gradient(135deg,#d24842,#8f1d19);overflow:hidden;transition:transform .45s var(--e),box-shadow .45s}
.btn.o{background:transparent;color:var(--r)}
.btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px -8px rgba(224,65,60,.7)}
.btn:active,.btn.go{transform:scale(.95);transition-duration:.25s}
.btn:before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg)}
.btn.go:before{animation:sw .5s var(--e)}
@keyframes sw{to{left:130%}}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;margin-top:26px;color:var(--mu);font-size:.85rem}
.tags span:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--r);margin-right:8px;box-shadow:0 0 8px var(--r)}
@media(min-width:860px){.hero{grid-template-columns:1fr 1.1fr;text-align:left;gap:60px}.hero p{margin-left:0}.orbs,.tags{justify-content:flex-start}.btns{margin:0;grid-template-columns:1fr 1fr;max-width:none}.pic{width:min(36vw,390px)}}
/* cards */
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.card{position:relative;padding:26px 24px;border-radius:20px;background:var(--g);border:1px solid var(--l);overflow:hidden;transition:transform .55s var(--e),background .55s,border-color .55s,box-shadow .55s}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),rgba(224,65,60,.24),transparent 65%);opacity:0;transition:opacity .5s;pointer-events:none}
.card:after{content:"";position:absolute;inset:0;border-radius:20px;padding:1.5px;background:conic-gradient(from var(--a),transparent 0 70%,#ff6a5f 88%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;pointer-events:none}
.card:hover{transform:translateY(-6px);border-color:rgba(224,65,60,.4);box-shadow:0 18px 40px -18px rgba(224,65,60,.5)}
.card:hover:before{opacity:1}.card:hover:after{opacity:1;animation:spin 1.1s var(--e) 1}
.card h3{font-size:1.1rem;font-weight:600;margin-bottom:8px}.card p{color:var(--mu);font-size:.9rem}
.ic{width:46px;height:46px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center;font-size:1.25rem;margin-bottom:16px;transition:transform .6s var(--b)}
.card:hover .ic{transform:scale(1.12) rotate(-8deg)}
.svc:hover{background:linear-gradient(160deg,#cc4540,#7f1c18)}.svc:hover p{color:#fff}.svc:hover .ic{background:#fff;color:var(--r)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chips span{padding:5px 13px;border-radius:99px;border:1px solid var(--l);font-size:.8rem;color:#ddd;background:rgba(255,255,255,.03);opacity:0;transform:scale(.6);transition:opacity .6s var(--e),transform .7s var(--b),border-color .3s,color .3s;transition-delay:calc(var(--k)*70ms + 300ms)}
.in .chips span{opacity:1;transform:none}.chips span:hover{border-color:var(--r);color:var(--r)}
/* about */
.about{display:grid;gap:34px;align-items:center}
.about img{width:min(100%,300px);aspect-ratio:1;object-fit:cover;object-position:50% 15%;border-radius:24px;margin:auto;display:block;box-shadow:0 0 0 1px rgba(224,65,60,.4),0 24px 70px -20px rgba(224,65,60,.6)}
.about h3{font-size:1.4rem;margin-bottom:12px}.about p{color:var(--mu);margin-bottom:24px;max-width:56ch}
@media(min-width:860px){.about{grid-template-columns:.8fr 1.2fr;gap:70px}}
/* work */
.pj{display:flex;flex-direction:column;justify-content:space-between;min-height:190px;gap:30px}
.pj .row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.pj .orb{flex:none;width:46px;height:46px;font-size:1.15rem}
/* contact */
.ct{text-align:center;padding:clamp(36px,8vw,64px) 22px;border-radius:28px}
.ct p{color:var(--mu);margin:8px auto 26px;max-width:40ch}
.ct .btn{max-width:300px;margin:auto}
.ct .orbs{margin:24px 0 0}
footer{margin-top:90px;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#a8322e,#5f100d);text-align:center;font-size:.82rem;color:#f5dcdc}
.bolt{position:fixed;height:2px;width:var(--len);margin-top:-1px;background:linear-gradient(90deg,transparent,#ff8a80 30%,#fff);box-shadow:0 0 12px var(--r);will-change:transform,opacity;transform-origin:0 50%;pointer-events:none;z-index:99;animation:bolt .42s var(--e) forwards}
.flash{position:fixed;width:120px;height:120px;margin:-60px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,120,110,.7),transparent);pointer-events:none;z-index:98;animation:fl .45s var(--e) forwards}
@keyframes bolt{0%{transform:rotate(var(--rot)) translateX(4px) scaleX(0);opacity:1}45%{transform:rotate(var(--rot)) translateX(20px) scaleX(1);opacity:1}100%{transform:rotate(var(--rot)) translateX(52px) scaleX(.2);opacity:0}}
@keyframes fl{from{transform:scale(.3);opacity:1}to{transform:scale(1.6);opacity:0}}
.pic{will-change:transform}.flash{will-change:transform,opacity}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important;scroll-behavior:auto!important}.rv{filter:none;transform:none}.pic{clip-path:none}.pic:after{animation:none}body:before{animation:none}}
</style>
